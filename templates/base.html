<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Daisy Sponsored Student{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Add Font Awesome (in <head> of base.html) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">

    <!-- Bootstrap & Custom CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-maroon mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Daisy Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">🏠 Home</a>
        </li>
        <li class="nav-item dropdown">
  <a class="nav-link dropdown-toggle {% if request.endpoint in ['about', 'team', 'success'] %}active{% endif %}" 
     href="#" id="aboutDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
    ℹ️ About Us
  </a>
  <ul class="dropdown-menu" aria-labelledby="aboutDropdown">
    <li><a class="dropdown-item" href="{{ url_for('about') }}">About Overview</a></li>
    <li><a class="dropdown-item" href="{{ url_for('team') }}">Our Team</a></li>
    <li><a class="dropdown-item" href="{{ url_for('success') }}">Success Stories</a></li>
  </ul>
</li>

        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'contact' %}active{% endif %}" href="{{ url_for('contact') }}">📞 Contact Info</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Content -->
<main class="container my-4">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="text-center mt-4 py-3 bg-light">
    <div>© 2025 | Designed by <strong>Gaylord Ndenga</strong></div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom Global Script -->
<script src="{{ url_for('static', filename='script.js') }}" defer></script>

<!-- Extra Scripts (for child templates like index.html) -->
{% block scripts %}{% endblock %}

</body>
</html>
